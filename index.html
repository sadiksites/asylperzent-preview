<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>«Асыл Перзент» балабақшасы — Бетқайнар</title><meta name="description" content="«Асыл Перзент» балабақшасы, Бетқайнар ауылы, Қордай ауданы. Детский сад «Асыл Перзент», с. Беткайнар.">
<link rel="icon" href="img/logo.jpg">
<style>
:root{--g:#3f9e85;--m:#8cc3b2;--o:#f08a24;--b:#3b8fd1;--y:#f6b73c;--ink:#24403a}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fbfdfc}
a{color:var(--g)}.w{max-width:1100px;margin:auto;padding:0 18px}
.top{background:var(--g);color:#fff;font-size:14px}.top .w{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:6px 18px;flex-wrap:wrap}.top a{color:#fff;text-decoration:none}.top .r{display:flex;gap:14px;align-items:center}.top svg{width:20px;height:20px;vertical-align:middle}
.lang button{border:1px solid #fff;background:none;color:#fff;padding:2px 9px;border-radius:12px;cursor:pointer;font-weight:600}.lang button[aria-pressed=true]{background:#fff;color:var(--g)}
header{background:#fff;box-shadow:0 2px 8px #0001;position:sticky;top:0;z-index:5}header .w{display:flex;align-items:center;gap:14px;padding:8px 18px}header img{height:56px}header b{font-size:18px}nav{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap}nav a{text-decoration:none;color:var(--ink);font-weight:600}nav a:hover{color:var(--o)}
.rb{height:6px;background:linear-gradient(90deg,#e84b4b,var(--o),var(--y),#7cc55a,var(--m),var(--b),#8a5cc7)}
.hero{position:relative;min-height:460px;display:flex;align-items:flex-end;background:#ccc center/cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000a,#0000 65%)}.hero .w{position:relative;z-index:1;color:#fff;padding-bottom:40px}.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px;line-height:1.15}.hero p{font-size:19px;max-width:620px;margin:0 0 18px}
.btn{display:inline-block;background:var(--o);color:#fff;padding:11px 22px;border-radius:26px;text-decoration:none;font-weight:700}
section{padding:54px 0}section:nth-of-type(even){background:#eef7f3}h2{font-size:30px;margin:0 0 22px;color:var(--g)}h2:after{content:"";display:block;width:60px;height:4px;background:var(--o);border-radius:2px;margin-top:6px}
.ab{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}.ab img{width:100%;border-radius:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;list-style:none;padding:0;margin:0}.cards li{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 12px #0000000f;text-align:center;font-weight:600}.cards .fi{font-size:34px;display:block}
.gr li{border-top:6px solid var(--c)}.gr b{display:block;font-size:22px;color:var(--c)}
.clubs{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0}.clubs li{background:#fff;border:2px solid var(--m);border-radius:22px;padding:8px 16px;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:28px}dl{margin:0}dt{font-weight:700;color:var(--g);margin-top:10px}dd{margin:0}
footer{background:var(--ink);color:#cde;padding:20px 0;font-size:14px}
@media(max-width:760px){nav{display:none}.ab,.ct{grid-template-columns:1fr}.hero{min-height:380px}header b{font-size:15px}}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:34px}.stats div{flex:1;min-width:90px;background:#fff;border-radius:16px;padding:16px;text-align:center;box-shadow:0 2px 10px #0001}.stats b{display:block;font-size:34px;color:var(--o)}.stf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}.stf figure{margin:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001}.stf img{width:100%;aspect-ratio:3/4;object-fit:contain;object-position:center;background:#f3f4f6;display:block}.stf figcaption{padding:10px;font-size:14px;text-align:center}</style></head><body>
<div class="top"><div class="w"><span id="hrs"></span><div class="r"><a id="tw"></a><a id="ig" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg></a><div class="lang"><button data-l="0">KZ</button><button data-l="1">RU</button></div></div></div></div>
<header><div class="w"><img src="img/logo.jpg" alt="Asyl Perzent"><b id="nm"></b><nav id="nav"></nav></div></header><div class="rb"></div>
<div class="hero" id="hero"><div class="w"><h1 id="h1"></h1><p id="tg"></p><a class="btn" id="cta"></a></div></div>
<section id="about"><div class="w ab"><div><h2 data-t="about"></h2><p id="abt"></p><p><b data-t="headl"></b> <span id="hd"></span></p></div><img src="img/wa/12.jpg" alt="" loading="lazy"></div></section>
<section id="adv"><div class="w"><h2 data-t="adv"></h2><ul class="cards" id="feats"></ul></div></section>
<section id="groups"><div class="w"><h2 data-t="groups"></h2><ul class="cards gr" id="grs"></ul><h2 style="margin-top:40px" data-t="clubs"></h2><ul class="clubs" id="cls"></ul></div></section>
<section id="staff"><div class="w"><div class="stats" id="sts"></div><h2 data-t="staff"></h2><div class="stf" id="stf"></div></div></section>
<section id="gallery"><div class="w"><h2 data-t="gallery"></h2><div class="gal" id="gal"></div></div></section>
<section id="contacts"><div class="w ct"><div><h2 data-t="contacts"></h2><dl id="cdl"></dl></div><iframe title="map" style="width:100%;min-height:300px;border:0;border-radius:16px" loading="lazy" src="https://maps.google.com/maps?q=%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%9A%D0%BE%D0%B6%D0%B0%D0%BD%D1%82%D0%B0%D0%B5%D0%B2%D0%B0%20147%2C%20%D0%91%D0%B5%D1%82%D2%9B%D0%B0%D0%B9%D0%BD%D0%B0%D1%80%2C%20%D0%9A%D0%BE%D1%80%D0%B4%D0%B0%D0%B9%D1%81%D0%BA%D0%B8%D0%B9%20%D1%80%D0%B0%D0%B9%D0%BE%D0%BD%2C%20%D0%96%D0%B0%D0%BC%D0%B1%D1%8B%D0%BB%D1%81%D0%BA%D0%B0%D1%8F%20%D0%BE%D0%B1%D0%BB%D0%B0%D1%81%D1%82%D1%8C%2C%20%D0%9A%D0%B0%D0%B7%D0%B0%D1%85%D1%81%D1%82%D0%B0%D0%BD&z=16&hl=ru&output=embed"></iframe></div></section>
<footer><div class="w">© 2018–2026 <span id="fn"></span></div></footer>
<script>
const T0={about:["Біз туралы","О нас"],headl:["Меңгеруші:","Руководитель:"],adv:["Біздің артықшылықтар","Наши преимущества"],groups:["Топтар","Группы"],clubs:["Үйірмелер мен сабақтар","Кружки и занятия"],gallery:["Фотогалерея","Фотогалерея"],staff:["Тәрбиешілеріміз","Наши воспитатели"],em:["E-mail","E-mail"],contacts:["Байланыс","Контакты"],age:["жас","года/лет"],cta:["WhatsApp-қа жазу","Написать в WhatsApp"],addr:["Мекенжай","Адрес"],ph:["Телефон","Телефон"],hrs:["Жұмыс уақыты","Режим работы"],nav:[["about","Біз туралы","О нас"],["groups","Топтар","Группы"],["gallery","Галерея","Галерея"],["contacts","Байланыс","Контакты"]]};
let D,L=+(localStorage.lang||0);const $=i=>document.getElementById(i),t=o=>typeof o=='string'?o:(L?o.ru||o.kk:o.kk),T=k=>T0[k][L];
function draw(){document.documentElement.lang=L?'ru':'kk';document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l==L));
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));const c=D.contact;
$('nm').textContent=$('h1').textContent=$('fn').textContent=t(D.name);$('tg').textContent=t(D.tagline);$('abt').textContent=t(D.about);$('hd').textContent=t(D.head);
$('hero').style.backgroundImage=`url(${D.hero})`;$('cta').textContent=T('cta');$('cta').href=$('tw').href='https://wa.me/'+c.watel;$('tw').textContent='📞 '+c.wa;$('ig').href='https://instagram.com/'+c.ig;$('hrs').textContent='🕗 '+t(c.hours);
$('nav').innerHTML=T0.nav.map(n=>`<a href="#${n[0]}">${n[1+L]}</a>`).join('');
$('feats').innerHTML=D.features.map(f=>`<li><span class="fi">${f.icon}</span>${t(f.title)}</li>`).join('');
$('grs').innerHTML=D.groups.map(g=>`<li style="--c:${g.color}"><b>«${t(g.name)}»</b>${g.age} ${T('age')}</li>`).join('');
$('cls').innerHTML=D.clubs.map(x=>`<li>${t(x)}</li>`).join('');
$('sts').innerHTML=(D.stats||[]).map(s=>`<div><b>${s.n}</b>${t(s)}</div>`).join('');$('stf').innerHTML=(D.staff||[]).map(s=>`<figure><img src="${s.photo}" alt="${s.name}" loading="lazy"><figcaption>${s.name}</figcaption></figure>`).join('');$('gal').innerHTML=D.gallery.map(p=>`<img src="${p}" alt="" loading="lazy">`).join('');
$('cdl').innerHTML=`<dt>${T('addr')}</dt><dd>${t(c.address)}</dd><dt>${T('ph')}</dt><dd><a href="tel:+${c.phone.replace(/\D/g,'')}">${c.phone}</a></dd><dt>${T('em')}</dt><dd><a href="mailto:${c.email}">${c.email}</a></dd><dt>WhatsApp</dt><dd><a href="https://wa.me/${c.watel}">${c.wa}</a></dd><dt>Instagram</dt><dd><a href="https://instagram.com/${c.ig}">@${c.ig}</a></dd><dt>${T('hrs')}</dt><dd>${t(c.hours)}</dd>`}
document.addEventListener('click',e=>{const b=e.target.closest('.lang button');if(b){L=+b.dataset.l;localStorage.lang=L;draw()}});
fetch('data/site.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{D=j;draw()});
</script></body></html>
